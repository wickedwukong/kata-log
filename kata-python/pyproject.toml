[project]
name = "kata-python"
version = "0.1.0"
description = "kata-log.rocks exercises in Python"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-diff>=0.1.14",
    "pytest-pretty>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-watcher>=0.4.3",
    "ruff>=0.16.3",
    "basedpyright==1.40.2",
]

# Exercises are plain folders, not an installable package.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
norecursedirs = [".venv", "reports", ".*"]

[tool.coverage.run]
branch = true
omit = ["*/test_*.py", ".venv/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PL"]
ignore = ["PLR0917"]

[tool.ruff.lint.pylint]
max-args = 7
allow-magic-value-types = ["str", "bytes", "int"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR0913", "PLR2004"]

[tool.basedpyright]
extraPaths = ["src"]
exclude = [".venv", "reports"]
typeCheckingMode = "standard"
